<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No zoom limits here on purpose: the page reports whether a pinch zooms it. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Browser probe</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #111111; --line: #c8c8c8; --card: #f3f3f3;
    --yes: #0a6b1f; --no: #b00020; --wait: #6a6a6a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101010; --fg: #f2f2f2; --line: #444444; --card: #1c1c1c;
      --yes: #6fe08a; --no: #ff7a8a; --wait: #a0a0a0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    background: var(--bg); color: var(--fg);
    font: 22px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { display: flex; flex-wrap: wrap; gap: 4px 24px; align-items: baseline; margin-bottom: 12px; }
  h1 { font-size: 30px; margin: 0; }
  #clock { font-variant-numeric: tabular-nums; font-weight: 700; }
  #sections { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 12px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 0; }
  h2 { font-size: 20px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .row { display: flex; gap: 12px; justify-content: space-between; padding: 5px 0; border-top: 1px solid var(--line); }
  .row .label { flex: 0 1 auto; }
  .row .value { flex: 1 1 50%; text-align: right; font-weight: 700; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .row.long { display: block; }
  .row.long .label, .row.long .value { display: block; }
  .row.long .value { text-align: left; }
  .value.yes { color: var(--yes); }
  .value.no { color: var(--no); }
  .value.wait { color: var(--wait); font-weight: 400; }
  canvas { display: block; width: 100%; height: auto; background: #000; border-radius: 4px; margin-bottom: 6px; }
  button {
    font: inherit; font-weight: 700; color: inherit;
    width: 100%; min-height: 64px; margin: 6px 0;
    background: var(--bg); border: 2px solid var(--fg); border-radius: 8px;
  }
</style>
</head>
<body>
<header>
  <h1>Browser probe</h1>
  <span id="version"></span>
  <span id="clock"></span>
</header>
<div id="sections"></div>
<noscript>JavaScript is off, so nothing can be probed.</noscript>
<script src="sample.js"></script>
<script src="probe.js"></script>
</body>
</html>
